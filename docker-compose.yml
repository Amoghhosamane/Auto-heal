services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPERATING_MODE=demo
      - DATABASE_URL=postgresql+asyncpg://autoheal:autoheal_secret@postgres:5432/autoheal_db
      - CORS_ORIGINS=["http://localhost:5173","https://auto-heal-one.vercel.app"]
      - LIVE_RECOVERY_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: autoheal
      POSTGRES_PASSWORD: autoheal_secret
      POSTGRES_DB: autoheal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoheal -d autoheal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
